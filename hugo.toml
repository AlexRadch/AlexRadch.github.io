# ============================================================
# AlexRadch.github.io — личный сайт-витрина для фрагментов/статей
# Тема: hugo-book v0.15.0 (фиксированный релиз)
# ============================================================

baseURL = 'https://alexradch.github.io/'
title = 'AlexRadch'
defaultContentLanguage = 'ru'       # язык сайта: берёт i18n/ru.yaml темы
defaultContentLanguageInSubdir = false
locale = 'ru-ru'                    # локаль: русские даты (Hugo ≥0.158)
copyright = '© [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.ru), код [MIT](https://github.com/AlexRadch/AlexRadch.github.io/blob/main/LICENSE)'
theme = 'hugo-book'
timeZone = 'Etc/UTC'              # часовой пояс для дат БЕЗ смещения (+07:00 и т.п. уважаются)
enableGitInfo = true            # дата последнего изменения из git
disablePathToLower = true       # сохранять регистр в URL (рекомендует тема)

# ------------------------------------------------------------
# Парсинг Markdown: разрешить HTML внутри страниц
# (нужно для шорткодов mermaid/katex и встраивания виджетов)
# ------------------------------------------------------------
[markup.goldmark.renderer]
  unsafe = true

# ------------------------------------------------------------
# Настройка оглавления справа (правая панель темы)
# ------------------------------------------------------------
[markup.tableOfContents]
  startLevel = 1                # включая H1 — чтобы по нему можно было вернуться наверх
  endLevel = 4

# ============================================================
# Параметры темы hugo-book
# ============================================================
[params]
  # ОТЛАДКА ЛЕВОГО МЕНЮ: включить HTML-комментарий с диагностикой
  # (видно в DevTools на любой странице). Выключить = false.
  DebugBookMenu = false

  # ОТЛАДКА ШИРИНЫ: подсветить фон топбара и контентной зоны,
  # чтобы видеть границы контейнеров. Выключить = false.
  DebugTopbarCss = false

  # Светлая/тёмная тема: light | dark | auto (переключатель на лету)
  BookTheme = 'auto'

  # Показывать оглавление (ToC) в правой части страниц
  # можно выключить на отдельной странице: bookToC: false
  BookToC = true

  # Бренд (логотип + ссылка на главную) вверху левого меню.
  # У нас ссылка на главную уже есть в топбаре, поэтому бренд
  # дублирует и съедает место. Default true (как у темы — рисовать),
  # у нас выключен на весь сайт; точечно: bookBrand во front matter.
  BookBrand = false

  # Хлебные крошки сверху страницы (как в main-ветке темы: default false).
  # Включено на весь сайт, чтобы сохранить текущий вид; выключить можно
  # точечно: bookBreadcrumbs: false во front matter страницы.
  BookBreadcrumbs = true

  # Входящие/исходящие ссылки под оглавлением (как в main-ветке темы:
  # default false). Включается на весь сайт (true здесь) или точечно
  # через front matter / cascade.
  BookPageLinks = false

  # Какую секцию рендерить как боковое меню по умолчанию.
  # '.' = текущий каталог (переносится в CurrentSection в menu-filetree.html)
  # '/' = все верхние секции сайта.
  # Можно переопределить в front matter раздела:
  #   bookSection = 'gists'  →  в меню только этот раздел
  BookSection = '.'

  # Хлебные крошки сверху страницы
  # Включить полнотекстовый поиск (MiniSearch)
  BookSearch = true

  # Дата в подвале (формат Go: точка отсчёта 02.01.2006 15:04)
  BookDateFormat = '2 January 2006'

  # Репозиторий — для кнопок «Изменить на GitHub» / «Последнее изменение»
  BookRepo = 'https://github.com/AlexRadch/AlexRadch.github.io'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/content/{{ .Path }}'
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

# ============================================================
# Постоянные меню — те самые «общие» ссылки для всего сайта.
# Показываются в боковой панели над/под деревом раздела.
# Пока пустые — добавим, когда появится About и другие страницы.
# ============================================================
[menu]
  # Верхнее меню темы не используется: своя панель (layouts/baseof.html)
  # закрывает все потребности — иконка на главную и переключатель темы.
  # [[menu.home]] и [[menu.before]] не задаются.
