# ============================================================
# AlexRadch.github.io — личный сайт-витрина для гистов/статей
# Тема: hugo-book v0.15.0 (фиксированный релиз)
# ============================================================

baseURL = 'https://alexradch.github.io/'
title = 'AlexRadch — заметки и обзоры'
locale = 'ru-ru'                  # язык сайта по умолчанию (Hugo ≥0.158)
theme = 'hugo-book'
timeZone = 'Etc/UTC'              # часовой пояс для дат БЕЗ смещения (+07:00 и т.п. уважаются)
enableGitInfo = true            # дата последнего изменения из git
disablePathToLower = true       # сохранять регистр в URL (рекомендует тема)

# ------------------------------------------------------------
# Парсинг Markdown: разрешить HTML внутри страниц
# (нужно для шорткодов mermaid/katex и встраивания виджетов)
# ------------------------------------------------------------
[markup.goldmark.renderer]
  unsafe = true

# ------------------------------------------------------------
# Настройка оглавления справа (правая панель темы)
# ------------------------------------------------------------
[markup.tableOfContents]
  startLevel = 1                # включая H1 — чтобы по нему можно было вернуться наверх
  endLevel = 4

# ============================================================
# Параметры темы hugo-book
# ============================================================
[params]
  # Светлая/тёмная тема: light | dark | auto (переключатель на лету)
  BookTheme = 'auto'

  # Показывать оглавление (ToC) в правой части страниц
  # можно выключить на отдельной странице: bookToC: false
  BookToC = true

  # Какую секцию рендерить как боковое меню по умолчанию.
  # '/' = все верхние секции сайта.
  # Благодаря нашему переопределённому menu-filetree.html это
  # значение переопределяется в front matter каждого раздела:
  #   bookSection = 'gists'  →  в меню только этот раздел
  BookSection = '/'

  # Хлебные крошки сверху страницы
  BookBreadcrumbs = true

  # Включить полнотекстовый поиск (MiniSearch)
  BookSearch = true

  # Дата в подвале (формат Go)
  BookDateFormat = 'January 2, 2006'

  # Репозиторий — для кнопок «Изменить на GitHub» / «Последнее изменение»
  # BookRepo = 'https://github.com/AlexRadch/AlexRadch.github.io'
  # BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/content/{{ .Path }}'
  # BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'

# ============================================================
# Постоянные меню — те самые «общие» ссылки для всего сайта.
# Показываются в боковой панели над/под деревом раздела.
# Пока пустые — добавим, когда появится About и другие страницы.
# ============================================================
[menu]
  # Верхнее меню темы не используется: своя панель (layouts/baseof.html)
  # закрывает все потребности — иконка на главную и переключатель темы.
  # [[menu.home]] и [[menu.before]] не задаются.
